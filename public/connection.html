<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Conexão auxiliar · Redator Batata</title>
  <style>
    :root { color-scheme:dark; font:14px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#f2f4ef; background:#0e1010; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 20px; min-height:100vh; display:grid; place-items:start center; background:radial-gradient(ellipse at 50% 0,#c3ed9b06,transparent 65%); }
    main { width:100%; max-width:420px; margin:20px auto 0; padding:28px; border:1px solid #ffffff16; border-radius:22px; background:#151718; box-shadow:0 18px 65px #0002; }
    .connection-mark { display:grid; place-items:center; width:42px; height:42px; margin-bottom:21px; border:1px solid #c3ed9b28; border-radius:13px; background:#c3ed9b0c; color:#c3ed9b; }
    .connection-mark svg { width:22px; height:22px; }
    .eyebrow { margin:0 0 7px; font-size:10px; font-weight:600; letter-spacing:1.5px; color:#a5b69a; }
    h1 { margin:0 0 19px; font-size:27px; line-height:1.25; letter-spacing:-1px; font-weight:550; }
    p { margin:0 0 19px; }
    #connection-status { min-height:48px; padding:14px; border:1px solid #ffffff0c; border-radius:12px; background:#1d2020; color:#d4dfcb; overflow-wrap:anywhere; }
    #connection-status[data-kind="error"] { color:#ffb5b5; border-color:#ffb5b525; }
    #manual-hint { color:#a4aaa2; font-size:13px; }
    button { width:100%; min-height:46px; padding:11px 14px; border:1px solid #c3ed9b; border-radius:11px; background:#c3ed9b; color:#172115; font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
    button:hover:enabled { background:#d1f5b0; }
    button:disabled { opacity:.45; cursor:default; }
    button:focus-visible,a:focus-visible { outline:2px solid #c3ed9b; outline-offset:4px; }
    a { color:#c6d5bb; text-underline-offset:3px; }
    .home { margin:21px 0 0; padding-top:19px; border-top:1px solid #ffffff0e; font-size:12px; text-align:center; }
    noscript { display:block; margin-top:18px; color:#ffb5b5; }
    @media (prefers-reduced-motion:no-preference) { button,a { transition:background .18s,color .18s; } }
    @media (max-width:400px) { body { padding:20px 16px; } main { margin-top:8px; padding:23px 20px; border-radius:18px; } }
  </style>
  <script src="/connection.js" defer></script>
</head>
<body>
  <main>
    <div class="connection-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 13 4-4M8 15l-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0M16 9l1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/></svg></div>
    <p class="eyebrow">CONEXÃO AUXILIAR</p>
    <h1>Redator Batata</h1>
    <p id="connection-status" role="status" aria-live="polite" aria-atomic="true">Conectando ao hub…</p>
    <p id="manual-hint">Se o navegador impedir a conexão entre as janelas, abra o hub aqui e cole seu texto de referência.</p>
    <button id="manual-open" type="button">Abrir hub nesta janela</button>
    <p class="home"><a href="/">Ver instruções de instalação</a></p>
    <noscript>Ative o JavaScript para usar o hub.</noscript>
  </main>
</body>
</html>
