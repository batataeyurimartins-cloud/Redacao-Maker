<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Conexão auxiliar · Redator Groq</title>
  <style>
    :root { color-scheme:dark; font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#eeeef1; background:#101012; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px 20px; }
    main { max-width:420px; margin:0 auto; }
    h1 { margin:0 0 14px; font-size:18px; font-weight:650; }
    p { margin:0 0 16px; }
    #connection-status { min-height:48px; overflow-wrap:anywhere; }
    #connection-status[data-kind="error"] { color:#f29ca9; }
    #manual-hint { color:#a2a2ae; font-size:12px; }
    button { padding:10px 14px; border:1px solid #ffffff24; border-radius:8px; background:#ededf1; color:#101012; font:inherit; font-weight:600; cursor:pointer; }
    button:hover:enabled { background:white; }
    button:disabled { opacity:.45; cursor:default; }
    button:focus-visible,a:focus-visible { outline:2px solid #d7d7e7; outline-offset:4px; }
    a { color:#ceced9; text-underline-offset:3px; }
    .home { margin-top:20px; font-size:12px; }
  </style>
  <script src="/connection.js" defer></script>
</head>
<body>
  <main>
    <h1>Redator Groq</h1>
    <p id="connection-status" role="status" aria-live="polite" aria-atomic="true">Conectando ao hub…</p>
    <p id="manual-hint">Se o navegador impedir a conexão entre as janelas, abra o hub aqui e cole seu texto de referência.</p>
    <button id="manual-open" type="button">Abrir hub nesta janela</button>
    <p class="home"><a href="/">Ver instruções de instalação</a></p>
    <noscript>Ative o JavaScript para usar o hub.</noscript>
  </main>
</body>
</html>
